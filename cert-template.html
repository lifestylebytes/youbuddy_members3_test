<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouBuddy Challenge Certification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #efe6d8;
      --paper: #fbf7f0;
      --paper-deep: #f3ebdf;
      --beige-100: #f8f1e6;
      --beige-200: #eadfcd;
      --beige-300: #d8c7af;
      --beige-400: #bca78b;
      --beige-500: #9d8367;
      --gold: #b7925f;
      --gold-soft: #d9bf94;
      --ink: #2f271f;
      --ink-soft: #66584b;
      --ink-faint: #9b8a79;
      --glass: rgba(255, 255, 255, 0.46);
      --shadow: 0 28px 80px rgba(90, 71, 45, 0.14);
      --f-serif: "Cormorant Garamond", serif;
      --f-sans: "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      padding: 32px 20px;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.55), transparent 32%),
        radial-gradient(circle at bottom right, rgba(183, 146, 95, 0.12), transparent 28%),
        linear-gradient(135deg, #e8dece 0%, #f5efe7 48%, #e9dfd1 100%);
      color: var(--ink);
      font-family: var(--f-sans);
    }
    .page-wrap { width: min(100%, 860px); margin: 0 auto; }
    .cert { position: relative; min-height: 1123px; padding: 18px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.1)); box-shadow: var(--shadow); }
    .paper { position: relative; min-height: 1087px; padding: 46px 54px 40px; background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.45)), linear-gradient(180deg, var(--paper) 0%, var(--paper-deep) 100%); border: 1px solid rgba(183, 146, 95, 0.22); overflow: hidden; }
    .frame-outer, .frame-inner { position: absolute; inset: 0; pointer-events: none; }
    .frame-outer { border: 1.5px solid var(--gold); }
    .frame-inner { inset: 9px; border: 1px solid rgba(183, 146, 95, 0.38); }
    .content { position: relative; z-index: 1; }
    header { text-align: center; margin-bottom: 26px; }
    .brand-row { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--beige-500), var(--gold)); color: #fff; font-size: 14px; font-weight: 700; }
    .brand-name { font-size: 18px; font-weight: 700; }
    .brand-name span { color: var(--beige-500); }
    .top-badge { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; padding: 7px 16px; border: 1px solid rgba(183, 146, 95, 0.24); background: var(--glass); backdrop-filter: blur(14px); color: var(--beige-500); border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
    .cert-title { font-family: var(--f-serif); font-size: 48px; font-weight: 600; letter-spacing: 0.08em; line-height: 1; }
    .cert-subtitle { margin-top: 6px; font-family: var(--f-serif); font-size: 20px; font-style: italic; color: var(--ink-soft); letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <main class="cert">
      <section class="paper">
        <div class="frame-outer"></div>
        <div class="frame-inner"></div>
        <div class="content">
          <header>
            <div class="brand-row">
              <div class="brand-mark">y</div>
              <div class="brand-name">you<span>buddy</span></div>
            </div>
            <div class="top-badge">3rd Premium Challenge Certification</div>
            <h1 class="cert-title">YouBuddy Challenge Certification</h1>
            <p class="cert-subtitle">3기 프리미엄 인증</p>
          </header>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
